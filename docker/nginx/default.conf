# Local-development reverse proxy in front of `vinext dev`.

# Vite's hot reload runs over a WebSocket. Without this map plus the Upgrade /
# Connection headers below, the page loads fine but silently stops live
# reloading — which is a miserable thing to debug.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream planner {
    # The compose service name, NOT localhost: inside this container localhost
    # is the proxy itself. This is the one place the classic Docker-localhost
    # trap actually applies.
    server app:3000;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The dev server streams RSC payloads; buffering them adds latency for no
    # benefit here.
    proxy_buffering off;

    location / {
        proxy_pass http://planner;

        # Preserve the full Host including port, so the app derives the same
        # origin the browser used (localhost:8443) rather than the internal one.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # TRUST_PROXY=true makes the app honour these two. Set them explicitly
        # so a client-supplied value can never pass through.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;

        # WebSocket upgrade for hot reload.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
