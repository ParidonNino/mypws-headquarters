name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ is required: the tests import .ts directly and rely on type
          # stripping, which is only unflagged from that version onward.
          node-version: "22"
          cache: npm

      - run: npm ci

      # typecheck + lint + unit tests. Fast, and needs no production build.
      - run: npm run check

      # Builds, then asserts on the server-rendered HTML.
      - run: npm run test:build
